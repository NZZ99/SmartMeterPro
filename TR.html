<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TR Sheet Viewer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Dark glassmorphism background style to match main.html */
    body {
      background-color: #030712;
      background-image: radial-gradient(circle at top right, rgba(29, 78, 216, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(15, 23, 42, 0.8), transparent 50%);
    }
    .liquid-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Styles to make Google Sheet Iframe fit to screen */
    .iframe-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 64px); /* Subtract header height */
      overflow: auto; /* Allow scrolling if sheet is extremely wide */
      -webkit-overflow-scrolling: touch;
    }

    /* Desktop version (Normal size) */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobile version responsive scaling (ဖုန်းမျက်နှာပြင်များအတွက် ဇယားအား ကျုံ့ပေးမည့်စနစ်) */
    @media (max-width: 768px) {
      .iframe-container {
        overflow: auto; /* စာမျက်နှာမပျက်ဘဲ scroll ဆွဲကြည့်နိုင်ရန် */
      }
      iframe {
        /* Iframe ၏ဧရိယာကို 140% အထိ ချဲ့ထုတ်ပြီး transform scale သုံး၍ ပြန်ကျုံ့ခြင်းဖြင့် 
           စာလုံးများကို သေးငယ်စေပြီး တစ်မျက်နှာတည်း၌ ကွက်တိ ပိုမိုပေါ်စေပါသည်။
        */
        width: 140%;
        height: 140%;
        transform: scale(0.680); /* 1 / 1.4 (71% ခန့် သေးသွားစေရန်) */
        transform-origin: top left;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col font-sans overflow-hidden">

  <!-- Header Section -->
  <header class="liquid-glass sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-lg h-16">
    <!-- Close Tab Button (Closes this tab and returns to main app) -->
    <button onclick="window.close();" class="flex items-center gap-1.5 text-slate-400 hover:text-red-400 px-3 py-1.5 rounded-xl hover:bg-slate-800/50 transition-all text-sm font-semibold">
      <i data-lucide="◄" class="w-5 h-5"></i>
      နောက်သို့
    </button>

    <!-- Title -->
    <h1 class="text-base font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center gap-2">
      <i data-lucide="file-spreadsheet" class="text-blue-400 w-5 h-5"></i>
      TR အချက်အလက်များ
    </h1>

    <!-- Refresh Button to reload Google Sheet data -->
    <button onclick="refreshSheet()" class="p-2 text-slate-400 hover:text-blue-400 hover:bg-blue-600/10 rounded-xl transition-all" title="Refresh Data">
      <i data-lucide="refresh-cw" id="refresh-icon" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- Google Sheets Embed Area -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="iframe-container relative bg-white">
      <!-- Loading Spinner -->
      <div id="loading" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-3 z-10">
        <div class="w-10 h-10 border-4 border-blue-500/20 border-t-blue-400 rounded-full animate-spin"></div>
        <p class="text-slate-400 text-sm">အချက်အလက်များကို ဆွဲယူနေပါသည်...</p>
      </div>

      <!-- 
        IMPORTANT: Replace the URL in the src attribute below with your published Google Sheets link.
        Appending &chrome=false&headers=false will remove unnecessary headers for a cleaner layout.
      -->
      <iframe 
        id="sheet-iframe"
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpf-bFoTK61C9_0oHeC__eeEgq2KtDZUNLcw7AF8XAZMidkZSGuN46Q2PuSZSjYjvJoKyTuNmN97Kb/pubhtml" 
        onload="hideLoading()">
      </iframe>
    </div>
  </main>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Hide Loading Spinner once iframe is loaded
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // Refresh function to reload the iframe with a timestamp to bypass caching
    function refreshSheet() {
      const iframe = document.getElementById('sheet-iframe');
      const loader = document.getElementById('loading');
      const refreshIcon = document.getElementById('refresh-icon');

      refreshIcon.classList.add('animate-spin');
      loader.style.display = 'flex';

      const currentSrc = iframe.src;
      if (currentSrc && currentSrc !== "YOUR_GOOGLE_SHEET_PUBLISH_LINK_HERE&chrome=false&headers=false") {
        const separator = currentSrc.includes('?') ? '&' : '?';
        const cleanSrc = currentSrc.split(/[&?]t=/)[0];
        iframe.src = cleanSrc + separator + 't=' + new Date().getTime();
      } else {
        iframe.src = iframe.src;
      }

      setTimeout(() => {
        refreshIcon.classList.remove('animate-spin');
      }, 1000);
    }
  </script>
</body>
</html>
