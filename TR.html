<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale=1.0 နှင့် user-scalable=no တို့ကြောင့် ဖုန်း browser ထဲတွင် zoom ဆွဲ၍မရအောင် လုံးဝပိတ်ဆို့ထားပါသည် -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TR Sheet Viewer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Dark glassmorphism background style to match main.html */
    body {
      background-color: #030712;
      background-image: radial-gradient(circle at top right, rgba(29, 78, 216, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(15, 23, 42, 0.8), transparent 50%);
    }
    .liquid-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Outmost Container */
    .iframe-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 64px); /* Subtract header height */
      overflow: auto; /* Allow normal scrolling/panning */
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y; /* Zoom ဆွဲခြင်းကို တားဆီးပြီး scroll ဆွဲခြင်းကိုသာ ခွင့်ပြုသည် */
    }

    /* Scaling Wrapper (White Screen မဖြစ်အောင် ကြားခံအလွှာဖြင့် ထိန်းချုပ်ခြင်း) */
    .scaling-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: top left;
      transition: transform 0.1s ease-out;
    }
    
    #sheet-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col font-sans overflow-hidden">

  <!-- Header Section -->
  <header class="liquid-glass sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-lg h-16">
    <!-- Close Tab Button (App အစကနေ ပြန်မလည်စေရန် Smart Navigation သုံးထားပါသည်) -->
    <button onclick="goBackOrClose();" class="flex items-center gap-1.5 text-slate-400 hover:text-red-400 px-2.5 py-1.5 rounded-xl hover:bg-slate-800/50 transition-all text-xs md:text-sm font-semibold">
      <i data-lucide="circle-arrow-out-up-left" class="w-4 h-4 md:w-5 md:h-5"></i>
      နောက်သို့
    </button>

    <!-- Center Title -->
    <h1 class="text-sm md:text-base font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center gap-2">
      <i data-lucide="file-spreadsheet" class="text-blue-400 w-4 h-4 md:w-5 md:h-5"></i>
      TR အချက်အလက်များ
    </h1>

    <!-- Right Actions (Refresh) -->
    <div class="flex items-center gap-2">
      <button onclick="refreshSheet()" class="p-2 text-slate-400 hover:text-blue-400 hover:bg-blue-600/10 rounded-xl transition-all" title="Refresh Data">
        <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4 md:w-5 md:h-5"></i>
      </button>
    </div>
  </header>

  <!-- Google Sheets Embed Area -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div id="iframe-container" class="iframe-container bg-white">
      <!-- Loading Spinner -->
      <div id="loading" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-3 z-10">
        <div class="w-10 h-10 border-4 border-blue-500/20 border-t-blue-400 rounded-full animate-spin"></div>
        <p class="text-slate-400 text-sm">အချက်အလက်များကို ဆွဲယူနေပါသည်...</p>
      </div>

      <!-- Wrapper for scaling to prevent white screen error -->
      <div id="scaling-wrapper" class="scaling-wrapper">
        <!-- 
          IMPORTANT: Replace the URL in the src attribute below with your published Google Sheets link.
          Appending &chrome=false&headers=false will remove unnecessary headers for a cleaner layout.
        -->
        <iframe 
          id="sheet-iframe"
          src="https://docs.google.com/spreadsheets/d/14h9si_F5l4OgWdWT-gJ-bP1uQ_YgDpUpbb9_6LgNlmY/preview" 
          onload="initSheetScaling()">
        </iframe>
      </div>
    </div>
  </main>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Default Zoom အား 40% (0.4) အသေ သတ်မှတ်ထားပြီး ဘယ်တော့မှ မပြောင်းလဲတော့ပါ
    let currentScale = 0.4; 

    // Hide Loading Spinner once iframe is loaded
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // Mathematical Responsive Scaling Logic (40% scale ကို အမြဲတမ်း တည်ငြိမ်စွာ ဆွဲပေးထားပါသည်)
    function applyScaling() {
      const container = document.getElementById('iframe-container');
      const wrapper = document.getElementById('scaling-wrapper');
      
      if (!container || !wrapper) return;

      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;

      wrapper.style.width = (containerWidth / currentScale) + 'px';
      wrapper.style.height = (containerHeight / currentScale) + 'px';
      wrapper.style.transform = `scale(${currentScale})`;
    }

    // Initialize scaling when iframe finishes loading
    function initSheetScaling() {
      hideLoading();
      logVisitTime();
      applyScaling();
      
      // Re-calculate scaling when window resizes
      window.addEventListener('resize', applyScaling);
    }
function logVisitTime() {
      // ⚠️ အောက်က URL နေရာမှာ ခုနက ရလာတဲ့ Deployment URL အသစ်ကို အစားထိုးပါ
      const WEB_APP_URL = "သင့်ရဲ့_WEB_APP_URL_အသစ်ကို_ဒီမှာထည့်ပါ"; 
      
      const userAgent = encodeURIComponent(navigator.userAgent);
      
      // ပိုမိုသေချာပြီး ချက်ချင်းဒေတာရောက်စေမည့် Image Beacon နည်းလမ်းဖြင့် ပို့ခြင်း
      const finalUrl = `${WEB_APP_URL}?userAgent=${userAgent}&t=${new Date().getTime()}`;
      
      const img = new Image();
      img.src = finalUrl;
    }
    function goBackOrClose() {
      // main.html ကို reload မဖြစ်စေဘဲ ဖွင့်ထားဆဲ browser tab အသစ်ကို တိုက်ရိုက်ပိတ်ခိုင်းလိုက်ခြင်း ဖြစ်သည်
      // ၎င်းကြောင့် မူရင်း Web App သည် ဝင်ကြည့်ထားသည့် အနေအထားအတိုင်း အနောက်တွင် ဆက်ရှိနေမည်ဖြစ်သည်
      window.close();
    }

    // Refresh function to reload the iframe with a timestamp to bypass caching
    function refreshSheet() {
      const iframe = document.getElementById('sheet-iframe');
      const loader = document.getElementById('loading');
      const refreshIcon = document.getElementById('refresh-icon');

      refreshIcon.classList.add('animate-spin');
      loader.style.display = 'flex';

      const currentSrc = iframe.src;
      if (currentSrc && currentSrc !== "YOUR_GOOGLE_SHEET_PUBLISH_LINK_HERE&chrome=false&headers=false") {
        const separator = currentSrc.includes('?') ? '&' : '?';
        const cleanSrc = currentSrc.split(/[&?]t=/)[0];
        iframe.src = cleanSrc + separator + 't=' + new Date().getTime();
      } else {
        iframe.src = iframe.src;
      }

      setTimeout(() => {
        refreshIcon.classList.remove('animate-spin');
      }, 1000);
    }
  </script>
</body>
</html>
