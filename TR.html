<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TR Sheet Viewer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* သင့်ရဲ့ main.html ဒီဇိုင်းနှင့် ကိုက်ညီသော နောက်ခံ Glassmorphism စတိုင် */
    body {
      background-color: #030712; /* Deep dark blue-black */
      background-image: radial-gradient(circle at top right, rgba(29, 78, 216, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(15, 23, 42, 0.8), transparent 50%);
    }
    .liquid-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col font-sans">

  <!-- Header Section -->
  <header class="liquid-glass sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-lg">
    <!-- Back Button (main.html သို့ ပြန်သွားရန်) -->
    <a href="main.html" class="flex items-center gap-1.5 text-slate-400 hover:text-white px-3 py-1.5 rounded-xl hover:bg-slate-800/50 transition-all text-sm font-semibold">
      <i data-lucide="chevron-left" class="w-5 h-5"></i>
      နောက်သို့
    </a>

    <!-- Title -->
    <h1 class="text-base font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center gap-2">
      <i data-lucide="file-spreadsheet" class="text-blue-400 w-5 h-5"></i>
      TR အချက်အလက်များ
    </h1>

    <!-- Refresh Button (Google Sheet data အသစ်များကို reload လုပ်ရန်) -->
    <button onclick="refreshSheet()" class="p-2 text-slate-400 hover:text-blue-400 hover:bg-blue-600/10 rounded-xl transition-all" title="Refresh Data">
      <i data-lucide="refresh-cw" id="refresh-icon" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- Google Sheets Embed Area -->
  <main class="flex-1 p-4 flex flex-col">
    <div class="flex-1 liquid-glass rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative bg-white min-h-[70vh]">
      <!-- Loading Spinner -->
      <div id="loading" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-3 z-10">
        <div class="w-10 h-10 border-4 border-blue-500/20 border-t-blue-400 rounded-full animate-spin"></div>
        <p class="text-slate-400 text-sm">အချက်အလက်များကို ဆွဲယူနေပါသည်...</p>
      </div>

      <!-- 
        **အရေးကြီးသည်** - အောက်ပါ src နေရာတွင်ရှိသော URL အစား 
        သင့်ရဲ့ Google Sheet မှရလာသော "Publish to web" embed link (iframe src link) ကို ထည့်ပေးပါ။
      -->
      <iframe 
        id="sheet-iframe"
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpf-bFoTK61C9_0oHeC__eeEgq2KtDZUNLcw7AF8XAZMidkZSGuN46Q2PuSZSjYjvJoKyTuNmN97Kb/pubhtml" 
        class="w-full h-full border-none"
        onload="hideLoading()">
      </iframe>
    </div>
  </main>

  <script>
    // Lucide Icons များကို ဖော်ပြရန်
    lucide.createIcons();

    // Loading ပြီးပါက Spinner ကို ဖျောက်ရန်
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // Google Sheets အချက်အလက်များကို အသစ်ပြန်ခေါ်ယူရန် (Cache မကျန်စေရန်)
    function refreshSheet() {
      const iframe = document.getElementById('sheet-iframe');
      const loader = document.getElementById('loading');
      const refreshIcon = document.getElementById('refresh-icon');

      // Refresh icon လည်ရန် animate ပေးခြင်း
      refreshIcon.classList.add('animate-spin');
      loader.style.display = 'flex';

      const currentSrc = iframe.src;
      if (currentSrc && currentSrc !== "YOUR_GOOGLE_SHEET_PUBLISH_LINK_HERE") {
        const separator = currentSrc.includes('?') ? '&' : '?';
        const cleanSrc = currentSrc.split(/[&?]t=/)[0];
        // Timestamp ထည့်ပြီး iframe ကို reload လုပ်ခိုင်းခြင်း
        iframe.src = cleanSrc + separator + 't=' + new Date().getTime();
      } else {
        // အကယ်၍ link မထည့်ရသေးပါက ပုံမှန်အတိုင်း reload လုပ်မည်
        iframe.src = iframe.src;
      }

      // စက္ကန့်အနည်းငယ်ကြာလျှင် icon လည်နေတာကို ရပ်တန့်ရန်
      setTimeout(() => {
        refreshIcon.classList.remove('animate-spin');
      }, 1000);
    }
  </script>
</body>
</html>
