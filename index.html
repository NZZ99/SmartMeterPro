<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Smart Meter Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Floating particles background effect */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Text Animation */
        .welcome-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hello-text {
            font-size: 1.5rem;
            letter-spacing: 8px;
            color: #64ffda;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .welcome-title {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #64ffda, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .loader {
            width: 100px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            margin: 25px auto;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-bar {
            position: absolute;
            width: 0%;
            height: 100%;
            background: #64ffda;
            animation: loading 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @media (max-width: 640px) {
            .welcome-title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particle-container"></div>

    <div class="welcome-container">
        <span class="hello-text">Hello</span>
        <h1 class="welcome-title">WELCOME</h1>
        <p class="mt-4 text-blue-200 opacity-60 font-light">Smart Meter Pro သို့ ဝင်ရောက်နေသည်...</p>
        
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>

    <script>
        // Background particles effect
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 4 + 1 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = Math.random() * 100 + 'vh';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.opacity = Math.random() * 0.5;
            container.appendChild(particle);
        }

        // Redirect logic
        const targetUrl = "main.html";
        
        function enterSite() {
            // Fade out effect before redirect
            document.querySelector('.welcome-container').style.opacity = '0';
            document.querySelector('.welcome-container').style.transform = 'scale(0.9)';
            document.querySelector('.welcome-container').style.transition = 'all 0.8s ease';
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        }

        // Auto redirect after 5 seconds
        setTimeout(() => {
            enterSite();
        }, 5000);
    </script>
</body>
</html>
