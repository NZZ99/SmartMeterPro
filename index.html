<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Meter Pro | Elite Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200;900&family=Inter:wght@100;400&display=swap');

        :root {
            --primary: #00f2ff;
            --secondary: #0062ff;
            --dark: #000814;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .main-ui {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        /* Aura Glow behind text */
        .aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.15) 0%, transparent 70%);
            filter: blur(50px);
            z-index: -1;
            animation: auraPulse 4s infinite alternate;
        }

        @keyframes auraPulse {
            from { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            to { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        .hero-title {
            font-family: 'Unbounded', cursive;
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -2px;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .hero-title span {
            display: block;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(30px);
            animation: revealText 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes revealText {
            to { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .subtitle {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 400;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 0.6; }
        }

        /* Technical Border Line */
        .tech-line {
            width: 60px;
            height: 1px;
            background: var(--primary);
            margin: 2rem auto;
            position: relative;
            opacity: 0;
            animation: lineGrow 1s ease 1.5s forwards;
        }

        @keyframes lineGrow {
            from { width: 0; opacity: 0; }
            to { width: 60px; opacity: 1; }
        }

        /* Progress Dots */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .dot {
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.2;
            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 10px var(--primary); }
        }

        /* Screen Flash for exit */
        #flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="mesh-canvas"></canvas>
    <div id="flash"></div>

    <div class="main-ui">
        <div class="aura"></div>
        <div class="subtitle">Welcome to</div>
        <h1 class="hero-title">
            <span style="animation-delay: 0.3s;">SMART</span>
            <span style="animation-delay: 0.5s; color: var(--primary);">METER</span>
            <span style="animation-delay: 0.7s;">PRO</span>
        </h1>
        <div class="tech-line"></div>
        <div class="dots-container">
            <div class="dot" style="animation-delay: 0s"></div>
            <div class="dot" style="animation-delay: 0.2s"></div>
            <div class="dot" style="animation-delay: 0.4s"></div>
        </div>
        <p class="mt-6 text-[9px] text-white/20 tracking-[4px] uppercase font-light">
            Authorizing Secure Channel...
        </p>
    </div>

    <script>
        const canvas = document.getElementById('mesh-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            particles = [];
            
            // Create a grid of particles for the 3D mesh effect
            const spacing = 60;
            for(let x = 0; x < width + spacing; x += spacing) {
                for(let y = 0; y < height + spacing; y += spacing) {
                    particles.push({
                        baseX: x,
                        baseY: y,
                        x: x,
                        y: y,
                        size: 1,
                        angle: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        function draw(time) {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = "rgba(0, 242, 255, 0.08)";
            ctx.lineWidth = 0.5;

            particles.forEach((p, i) => {
                // Wave movement logic
                const waveX = Math.sin(time * 0.001 + (p.baseX * 0.01)) * 20;
                const waveY = Math.cos(time * 0.001 + (p.baseY * 0.01)) * 20;
                
                p.x = p.baseX + waveX;
                p.y = p.baseY + waveY;

                // Draw connecting lines to neighbor particles
                // (Optimized: only draw to the one on the right and bottom)
                const nextX = particles.find(other => other.baseX === p.baseX + 60 && other.baseY === p.baseY);
                const nextY = particles.find(other => other.baseY === p.baseY + 60 && other.baseX === p.baseX);

                if(nextX) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(nextX.x, nextX.y);
                    ctx.stroke();
                }
                if(nextY) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(nextY.x, nextY.y);
                    ctx.stroke();
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        requestAnimationFrame(draw);

        // Redirect logic with White Flash Transition
        const targetUrl = "main.html"; 

        setTimeout(() => {
            const flash = document.getElementById('flash');
            flash.style.transition = "opacity 0.8s ease-in";
            flash.style.opacity = "1";

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        }, 4500);
    </script>
</body>
</html>
